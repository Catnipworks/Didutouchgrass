name: flutter_cat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  url_launcher: ^6.2.5
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # Added the icon generator tool here
  flutter_launcher_icons: ^0.13.1

# This must be left-aligned (no spaces before it)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Ensure your assets are registered here
  assets:
    - assets/icon.png

  fonts:
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf